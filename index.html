<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кольцов В. — студент СКФУ</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a0f2c 0%, #101d4d 45%, #1a2f6e 100%);
    background-attachment: fixed;
    font-family: 'Segoe UI', 'Roboto', sans-serif;
    color: #e8ecff;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* звёздный фон */
  .stars { position: fixed; inset: 0; pointer-events: none; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%;
          background: #fff; opacity: .6; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%,100% { opacity:.15 } 50% { opacity:.85 } }

  header { text-align: center; margin-top: 14vh; padding: 0 20px; }

  h1 {
    font-size: clamp(2rem, 6vw, 3.6rem);
    letter-spacing: .04em;
    color: #7db4ff;
    text-shadow: 0 0 25px rgba(90,140,255,.45);
    min-height: 1.3em;
  }

  .cursor {
    display: inline-block;
    width: 3px; height: 1em;
    background: #7db4ff;
    margin-left: 4px;
    vertical-align: text-bottom;
    animation: blink .8s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .sub {
    margin-top: 14px;
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: #a9b8e8;
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 1.2s 2.6s forwards;
  }
  @keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }

  /* змейка */
  .game-wrap {
    margin: 48px 0 40px;
    padding: 22px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(125,180,255,.25);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    text-align: center;
  }

  .hud {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: .95rem; color: #a9b8e8;
  }
  .hud b { color: #7db4ff; font-size: 1.1rem; }

  canvas {
    display: block;
    border-radius: 12px;
    background: #0a0f28;
    box-shadow: inset 0 0 40px rgba(0,0,0,.6);
    max-width: 100%;
  }

  .hint { margin-top: 12px; font-size: .85rem; color: #6f7fb8; }
  kbd {
    background: rgba(125,180,255,.15); border: 1px solid rgba(125,180,255,.35);
    border-radius: 5px; padding: 1px 7px; font-size: .8rem; color: #cfe0ff;
  }

  button {
    margin-top: 14px; padding: 10px 26px;
    border: none; border-radius: 10px; cursor: pointer;
    background: linear-gradient(135deg, #2a55c9, #4f8bff);
    color: #fff; font-size: .95rem; font-weight: 600;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,139,255,.4); }

  footer { margin-bottom: 30px; font-size: .85rem; color: #5c6a9e; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <header>
    <h1><span id="type"></span><span class="cursor"></span></h1>
    <div class="sub">Студент СКФУ</div>
  </header>

  <div class="game-wrap">
    <div class="hud">
      <span>Счёт: <b id="score">0</b></span>
      <span>Рекорд: <b id="best">0</b></span>
    </div>
    <canvas id="game" width="400" height="400"></canvas>
    <div class="hint">Управление: <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd> или свайпы на телефоне</div>
    <button id="restart">Начать заново</button>
  </div>

  <footer>Кольцов В. ✦ СКФУ ✦ 2026</footer>

<script>
/* --- печатающийся и стирающийся текст --- */
const phrases = ['Кольцов В.', 'Студент СКФУ', 'Future Developer'];
const typeEl = document.getElementById('type');
let pi = 0, ci = 0, deleting = false;

(function typeLoop() {
  const full = phrases[pi];
  if (!deleting) {
    ci++;
    typeEl.textContent = full.slice(0, ci);
    if (ci === full.length) { deleting = true; return setTimeout(typeLoop, 1800); }
  } else {
    ci--;
    typeEl.textContent = full.slice(0, ci);
    if (ci === 0) { deleting = false; pi = (pi + 1) % phrases.length; return setTimeout(typeLoop, 500); }
  }
  setTimeout(typeLoop, deleting ? 55 : 110);
})();

/* --- звёзды --- */
const stars = document.getElementById('stars');
for (let i = 0; i < 90; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random() * 100 + '%';
  s.style.top = Math.random() * 100 + '%';
  s.style.animationDelay = Math.random() * 3 + 's';
  stars.appendChild(s);
}

/* --- змейка --- */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const CELL = 20, COLS = cv.width / CELL, ROWS = cv.height / CELL;
const scoreEl = document.getElementById('score'), bestEl = document.getElementById('best');
let snake, dir, nextDir, food, score, best = 0, timer, alive;

function reset() {
  snake = [{x:8,y:10},{x:7,y:10},{x:6,y:10}];
  dir = {x:1,y:0}; nextDir = dir; score = 0; alive = true;
  placeFood(); updateHud(); tick(); clearTimeout(timer);
  timer = setInterval(step, 110);
}
function placeFood() {
  do { food = {x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS)}; }
  while (snake.some(s => s.x === food.x && s.y === food.y));
}
function updateHud() {
  scoreEl.textContent = score;
  if (score > best) { best = score; bestEl.textContent = best; }
}
function step() {
  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};
  if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) { score++; updateHud(); placeFood(); }
  else snake.pop();
  draw();
}
function gameOver() {
  clearTimeout(timer); alive = false; draw();
  ctx.fillStyle = 'rgba(10,15,40,.75)';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#7db4ff'; ctx.textAlign = 'center';
  ctx.font = 'bold 30px Segoe UI';
  ctx.fillText('Игра окончена', cv.width/2, cv.height/2 - 8);
  ctx.font = '15px Segoe UI'; ctx.fillStyle = '#a9b8e8';
  ctx.fillText('Счёт: ' + score + ' — нажмите «Начать заново»', cv.width/2, cv.height/2 + 22);
}
function tick() {
  // лёгкая пульсация еды
  requestAnimationFrame(tick);
}
function draw() {
  ctx.fillStyle = '#0a0f28'; ctx.fillRect(0, 0, cv.width, cv.height);
  // сетка
  ctx.strokeStyle = 'rgba(125,180,255,.06)';
  for (let i = 0; i <= COLS; i++) { ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,cv.height); ctx.stroke(); }
  for (let j = 0; j <= ROWS; j++) { ctx.beginPath(); ctx.moveTo(0,j*CELL); ctx.lineTo(cv.width,j*CELL); ctx.stroke(); }
  // еда
  ctx.fillStyle = '#ff5d7a';
  ctx.shadowColor = '#ff5d7a'; ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x*CELL + CELL/2, food.y*CELL + CELL/2, CELL/2 - 3, 0, Math.PI*2);
  ctx.fill(); ctx.shadowBlur = 0;
  // змейка
  snake.forEach((s, i) => {
    const t = 1 - i / (snake.length + 4);
    ctx.fillStyle = i === 0 ? '#9ecbff' : `rgba(79,139,255,${0.45 + 0.5*t})`;
    ctx.shadowColor = '#4f8bff'; ctx.shadowBlur = i === 0 ? 14 : 6;
    ctx.beginPath();
    ctx.roundRect(s.x*CELL + 2, s.y*CELL + 2, CELL - 4, CELL - 4, 6);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}

document.addEventListener('keydown', e => {
  const map = {ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}};
  const d = map[e.key];
  if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
});

let ts = null;
cv.addEventListener('touchstart', e => ts = e.touches[0], {passive:true});
cv.addEventListener('touchend', e => {
  if (!ts) return;
  const t = e.changedTouches[0], dx = t.clientX - ts.clientX, dy = t.clientY - ts.clientY;
  let d;
  if (Math.abs(dx) > Math.abs(dy)) d = dx > 0 ? {x:1,y:0} : {x:-1,y:0};
  else d = dy > 0 ? {x:0,y:1} : {x:0,y:-1};
  if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  ts = null;
}, {passive:true});

document.getElementById('restart').addEventListener('click', reset);

reset();
</script>
</body>
</html>
